<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — PageTurn</title><link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/app.js" defer></script></head><body class="auth-page"><main class="auth-layout"><section class="auth-art"><a class="brand light" href="index.html"><span class="brand-mark">P</span><span>PageTurn<small>LIBRARY SPACE</small></span></a><div><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Share what<br>you know.</h1><p>Become a reader or publish your own work. Every great journey begins with one page.</p></div><span class="art-note">READ · LEARN · GROW</span></section><section class="auth-panel"><div class="auth-form-wrap"><a class="back-link" href="index.html">← Back to library</a><span class="eyebrow">GET STARTED</span><h2>Create your account</h2><p class="muted">Join readers and authors on PageTurn.</p><form id="registerForm" class="stack-form"><label>Full name<input name="name" placeholder="Your full name" required maxlength="100"></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" placeholder="At least 6 characters" minlength="6" required></label><label>I want to join as<select name="role" required><option value="member">Reader / Member</option><option value="author">Author</option></select></label><button class="btn primary full" type="submit">Create account <span>→</span></button></form><p class="switch-auth">Already have an account? <a href="login.html">Sign in</a></p><div class="form-message" id="formMessage"></div></div></section></main></body></html>
